name: Build Samsung Kernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Device model (e.g., g770f)'
        required: true
        default: g770f

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout kernel source
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: sh4dow6oy/samsung_kernel
          ref: SM-G770F
          submodules: recursive
          fetch-depth: 0

      # 🔹 Add upstream not_r8q
      - name: Add not_r8q upstream
        run: |
          git remote add upstream https://github.com/skye-tachyon/not_r8q.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories -m "Merge not_r8q upstream" || echo "Merge conflicts? Resolve manually"

      # 🔹 Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git bc bison flex libssl-dev libncurses5-dev \
            libelf-dev wget tar unzip zip ccache zstd

            # 🔹 Setup prebuilt LLVM/Clang (via llvm-project release)
      - name: Setup LLVM/Clang from llvm-project Release
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O clang.tar.xz "https://release-assets.githubusercontent.com/github-production-release-asset/75821432/804075b7-4bee-405c-b0f4-09f0caf48078?sp=r&sv=2018-11-09&sr=b&spr=https&se=2025-10-21T12%3A19%3A26Z&rscd=attachment%3B+filename%3Dclang%2Bllvm-15.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2025-10-21T11%3A18%3A28Z&ske=2025-10-21T12%3A19%3A26Z&sks=b&skv=2018-11-09&sig=atEey3ydCFAk7hSdyF%2Byh0jW8eax23KBIM%2F2oGFVNcQ%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc2MTA0OTE4NiwibmJmIjoxNzYxMDQ1NTg2LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.aUNyutlCW_rg7OFiF3rD2mbZQDRPfo2Gl3uphFe1Lk4&response-content-disposition=attachment%3B%20filename%3Dclang%2Bllvm-15.0.6-x86_64-linux-gnu-ubuntu-18.04.tar.xz&response-content-type=application%2Foctet-stream"
          tar -xf clang.tar.xz -C "$TOOLCHAIN_PATH"
          TOOLCHAIN_BIN=$(find "$TOOLCHAIN_PATH" -type d -name "bin" | head -n1)
          echo "PATH=$TOOLCHAIN_BIN:$PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_BIN/clang" >> $GITHUB_ENV
          echo "LD=$TOOLCHAIN_BIN/ld.lld" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN_BIN/llvm-ar" >> $GITHUB_ENV
          echo "NM=$TOOLCHAIN_BIN/llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=$TOOLCHAIN_BIN/llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=$TOOLCHAIN_BIN/llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN_BIN/llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$TOOLCHAIN_BIN/aarch64-linux-gnu-" >> $GITHUB_ENV


      # 🔹 Download AOSP core (pentru liblog)
      - name: Clone AOSP core if missing
        run: |
          if [ ! -d "$PWD/aosp/system/core" ]; then
            mkdir -p aosp
            git clone https://android.googlesource.com/platform/system/core aosp/system/core
          fi

      # 🔹 Detect defconfig
      - name: Detect defconfig
        id: detect-config
        run: |
          MODEL=${{ github.event.inputs.model }}
          DEFCONFIG=$(ls arch/arm64/configs/*_${MODEL}_defconfig 2>/dev/null || ls arch/arm64/configs/*_defconfig | head -n1)
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ No defconfig found for model $MODEL"
            exit 1
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_OUTPUT

      # 🔹 Clean output directory
      - name: Clean output directory
        run: rm -rf out

      # 🔹 Configure kernel
      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 ${{ steps.detect-config.outputs.DEFCONFIG_NAME }} CC=$CC CROSS_COMPILE=$CROSS_COMPILE

      # 🔹 Patch kernel config (disable stack protector)
      - name: Patch kernel config
        run: |
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

      # 🔹 Build kernel
      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            LD=$LD \
            KCFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS_MODULE="-fno-stack-protector" \
            -j$(nproc)

      # 🔹 Upload kernel artifacts
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image.gz-dtb
