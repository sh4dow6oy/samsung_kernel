name: Build Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: out

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up kernel build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc

    - name: Compile Kernel
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        make O=${{ env.OUTPUT_DIR }} defconfig
        make -j$(nproc) O=${{ env.OUTPUT_DIR }}

    - name: Prepare artifacts
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}/artifacts
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image ${{ env.OUTPUT_DIR }}/artifacts/
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/dts/*/*.dtb ${{ env.OUTPUT_DIR }}/artifacts/ || true
        cd ${{ env.OUTPUT_DIR }}/artifacts
        zip -r kernel_build.zip *

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v3
      with:
        name: kernel_build
        path: ${{ env.OUTPUT_DIR }}/artifacts/kernel_build.zip
