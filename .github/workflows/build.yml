name: Build Samsung SM-G770F Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout kernel source
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: sh4dow6oy/samsung_kernel
          ref: SM-G770F
          submodules: recursive

      # 2️⃣ Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make git bc bison flex libssl-dev libncurses5-dev libelf-dev wget tar

      # 3️⃣ Clean output folder
      - name: Clean output folder
        run: rm -rf out

      # 4️⃣ Configure kernel using g770f_defconfig
      - name: Configure kernel
        run: make O=out ARCH=arm64 g770f_defconfig CC=clang

      # 5️⃣ Build kernel
      - name: Build kernel
        run: make O=out ARCH=arm64 CC=clang -j$(nproc)

      # 6️⃣ Package kernel + dtb + modules
      - name: Package kernel
        run: |
          mkdir -p package
          # Copy Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb package/
          # Copy modules
          make O=out ARCH=arm64 INSTALL_MOD_PATH=package modules_install
          # Create tar.gz
          tar -czvf kernel-sm-g770f.tar.gz -C package .
        working-directory: ./kernel

      # 7️⃣ Upload packaged kernel
      - name: Upload packaged kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm-g770f
          path: kernel/out/kernel-sm-g770f.tar.gz
