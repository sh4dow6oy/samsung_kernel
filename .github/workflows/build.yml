name: Build SM-G770F Kernel

on:
  workflow_dispatch:
    inputs:
      ramdisk_url:
        description: 'Public URL to stock ramdisk.img (optional)'
        required: false
        default: ''
      withKernelSU:
        description: 'Apply KernelSU (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT: out
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses-dev libelf-dev python3 python3-pip curl zip unzip

      - name: Setup toolchain (Linaro)
        run: |
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          TOOLCHAIN_TAR=gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          if [ ! -d gcc-linaro ]; then
            curl -LO https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64/${TOOLCHAIN_TAR}
            tar xf ${TOOLCHAIN_TAR}
            mv gcc-linaro-* gcc-linaro
          fi
          echo "$HOME/toolchains/gcc-linaro/bin" >> $GITHUB_PATH

      - name: Show defconfig
        run: echo "Using defconfig: G770F_defconfig"

      - name: Prepare build
        run: |
          mkdir -p ${OUT}
          make O=${OUT} ARCH=${ARCH} G770F_defconfig

      - name: Apply KernelSU
        if: ${{ github.event.inputs.withKernelSU == 'true' }}
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          echo -e "CONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/G770F_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=${OUT} ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE}

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -v ${OUT}/arch/arm64/boot/Image* artifacts/ || true
          cp -v ${OUT}/arch/arm64/boot/dts/*.dtb artifacts/ || true
          tar -czf artifacts/kernel_artifacts.tar.gz -C artifacts .

      - name: Download ramdisk
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: curl -fsSL "${{ github.event.inputs.ramdisk_url }}" -o ramdisk.img

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/tiann/AnyKernel3 AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=auto;/' AnyKernel3/anykernel.sh

      - name: Create boot image
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: |
          KIMG=${OUT}/arch/arm64/boot/Image
          cp $KIMG AnyKernel3/
          cp ramdisk.img AnyKernel3/
          cd AnyKernel3
          zip -r ../boot_custom.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_artifacts
          path: |
            artifacts/kernel_artifacts.tar.gz
            AnyKernel3/boot_custom.zip
