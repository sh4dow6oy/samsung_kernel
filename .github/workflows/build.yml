name: Build SM-G770F Kernel

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_dispatch:
    inputs:
      ramdisk_url:
        description: 'Public URL to stock ramdisk.img (optional)'
        required: false
        default: ''
      defconfig:
        description: 'Defconfig name'
        required: false
        default: 'G770F_defconfig'
      base:
        description: 'Kernel base address (hex)'
        required: false
        default: '0x10000000'
      pagesize:
        description: 'Flash page size (decimal)'
        required: false
        default: '4096'
      cmdline:
        description: 'Kernel cmdline'
        required: false
        default: 'console=ttyS0,115200n8 androidboot.hardware=samsung'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT: ${{ env.OUT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses-dev libelf-dev device-tree-compiler lz4 python3 python3-pip curl unzip zip wget

      - name: Install Linaro toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          TOOLCHAIN_TAR=gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          if [ ! -d "$HOME/toolchains/gcc-linaro" ]; then
            curl -sSL -O https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64/${TOOLCHAIN_TAR}
            tar xf ${TOOLCHAIN_TAR}
            mv gcc-linaro-* gcc-linaro || true
          fi
          echo "$HOME/toolchains/gcc-linaro/bin" >> $GITHUB_PATH

      - name: Show defconfig
        run: echo "Using defconfig: ${{ github.event.inputs.defconfig }}"

      - name: Prepare build output
        run: |
          mkdir -p ${OUT}
          make O=${OUT} ARCH=${ARCH} ${{ github.event.inputs.defconfig }}

      - name: Build kernel, dtbs, modules
        run: make -j$(nproc) O=${OUT} ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE}

      - name: Collect kernel artifacts
        run: |
          mkdir -p artifacts
          cp -v ${OUT}/arch/arm64/boot/Image* artifacts/ || true
          cp -v ${OUT}/arch/arm64/boot/dts/*.dtb artifacts/ || true
          tar -czf artifacts/kernel_artifacts.tar.gz -C artifacts .

      - name: Download ramdisk
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: curl -fsSL "${{ github.event.inputs.ramdisk_url }}" -o ramdisk.img

      - name: Create boot image
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: |
          python3 <<'EOF'
import struct, os
AND_MAGIC=b'ANDROID!'
def align(size,page): return ((size+page-1)//page)*page
def mkboot(kernel, ramdisk, out_file, base, pagesize, cmdline):
    k=open(kernel,'rb').read()
    r=open(ramdisk,'rb').read()
    hdr=struct.pack('<8s10I16s512s32s', AND_MAGIC, len(k), base+0x8000, len(r), base+0x1000000, 0,0,base+0x100, pagesize,0,0,b'', cmdline.encode('ascii')[:511].ljust(512,b'\0'), b'\0'*32)
    with open(out_file,'wb') as f:
        f.write(hdr.ljust(pagesize,b'\0'))
        f.write(k.ljust(align(len(k),pagesize),b'\0'))
        f.write(r.ljust(align(len(r),pagesize),b'\0'))
mkboot('${OUT}/arch/arm64/boot/Image', 'ramdisk.img', 'boot_custom.img', int('${{ github.event.inputs.base }}',0), int('${{ github.event.inputs.pagesize }}'), '${{ github.event.inputs.cmdline }}')
EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_and_boot
          path: |
            artifacts/kernel_artifacts.tar.gz
            ${OUT}/arch/arm64/boot/Image*
            ${OUT}/arch/arm64/boot/dts/*.dtb
            boot_custom.img
