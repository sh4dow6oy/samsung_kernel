name: Build Samsung Kernel (SM-G770F)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Device model (e.g., g770f)'
        required: true
        default: g770f

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout kernel source
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: sh4dow6oy/samsung_kernel
          ref: SM-G770F
          submodules: recursive
          fetch-depth: 0

      # 🔹 Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git bc bison flex libssl-dev libncurses5-dev \
            libelf-dev wget tar clang lld llvm unzip zip ccache zstd

      # 🔹 Setup Neutron Clang
      - name: Setup Neutron Clang
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O neutron-clang.tar.zst \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
          tar --use-compress-program=unzstd -xf neutron-clang.tar.zst -C "$TOOLCHAIN_PATH"
          TOOLCHAIN_BIN=$(find "$TOOLCHAIN_PATH" -type f -name "clang" | head -n1 | xargs dirname)
          LD_BIN=$(find "$TOOLCHAIN_PATH" -type f -name "ld.lld" | head -n1 | xargs dirname)
          echo "PATH=$TOOLCHAIN_BIN:$LD_BIN:$PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_BIN/clang" >> $GITHUB_ENV
          echo "LD=$LD_BIN/ld.lld" >> $GITHUB_ENV

      # 🔹 Setup GCC 13.4.0 aarch64
      - name: Setup GCC 13.4.0 aarch64
        run: |
          GCC_PATH="$PWD/toolchain/gcc-13.4.0-aarch64"
          mkdir -p "$GCC_PATH"
          wget -O gcc-13.4.0-aarch64.tar.bz2 \
            "https://github.com/termux-user-repository/ndk-toolchain-gcc-13/releases/download/v13.4.0-r0/gcc-13.4.0-aarch64.tar.bz2"
          tar -xjf gcc-13.4.0-aarch64.tar.bz2 -C "$GCC_PATH"
          GCC_BIN=$(find "$GCC_PATH" -type d -name "bin" | head -n1)
          echo "PATH=$GCC_BIN:$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$GCC_BIN/aarch64-linux-gnu-" >> $GITHUB_ENV

      # 🔹 Clone AOSP core (for liblog)
      - name: Clone AOSP core if missing
        run: |
          if [ ! -d "$PWD/aosp/system/core" ]; then
            mkdir -p aosp
            git clone https://android.googlesource.com/platform/system/core aosp/system/core
          fi

      # 🔹 Detect defconfig
      - name: Detect defconfig
        id: detect-config
        run: |
          MODEL=${{ github.event.inputs.model }}
          DEFCONFIG=$(ls arch/arm64/configs/*_${MODEL}_defconfig 2>/dev/null || ls arch/arm64/configs/*_defconfig | head -n1)
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ No defconfig found for model $MODEL"
            exit 1
          fi
          echo "DEFCONFIG_NAME=$(basename $DEFCONFIG)" >> $GITHUB_OUTPUT

      # 🔹 Clean output directory
      - name: Clean output directory
        run: rm -rf out

      # 🔹 Configure kernel
      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 ${{ steps.detect-config.outputs.DEFCONFIG_NAME }} CC=$CC CROSS_COMPILE=$CROSS_COMPILE

      # 🔹 Patch kernel config (disable stack protector)
      - name: Patch kernel config
        run: |
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

      # 🔹 Build kernel
      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CC=$CC \
            LD=$LD \
            CROSS_COMPILE=$CROSS_COMPILE \
            KCFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS_MODULE="-fno-stack-protector" \
            -j$(nproc)

      # 🔹 Upload kernel artifacts
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/arch/arm64/boot/Image.gz-dtb
