name: Build SM-G770F Kernel and Boot Image

on:
  workflow_dispatch:
    inputs:
      ramdisk_url:
        description: 'Public URL to stock ramdisk.img (optional).'
        required: false
        default: ''
      defconfig:
        description: 'Defconfig name to use'
        required: false
        default: 'G770F_defconfig'
      base:
        description: 'Kernel base address (hex), e.g. 0x10000000'
        required: false
        default: '0x10000000'
      pagesize:
        description: 'Flash page size'
        required: false
        default: '4096'
      cmdline:
        description: 'Kernel cmdline'
        required: false
        default: 'console=ttyS0,115200n8 androidboot.hardware=samsung'
  push:
    branches:
      - SM-G770F

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses-dev libelf-dev device-tree-compiler lz4 python3 python3-pip curl

      - name: Install cross toolchain (Linaro)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          TOOLCHAIN_TAR=gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          if [ ! -d "$HOME/toolchains/gcc-linaro" ]; then
            curl -sSL -O https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64/${TOOLCHAIN_TAR}
            tar xf ${TOOLCHAIN_TAR}
            mv gcc-linaro-* gcc-linaro || true
          fi
          echo "$HOME/toolchains/gcc-linaro/bin" >> $GITHUB_PATH

      - name: Show defconfig
        run: echo "Using defconfig: ${{ github.event.inputs.defconfig }}"

      - name: Build kernel using Makefile
        run: |
          make all DEFCONFIG=${{ github.event.inputs.defconfig }}

      - name: Download ramdisk if provided
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: |
          curl -fsSL "${{ github.event.inputs.ramdisk_url }}" -o ramdisk.img

      - name: Package boot image (if ramdisk present)
        if: ${{ github.event.inputs.ramdisk_url != '' }}
        run: |
          make package RAMDISK=ramdisk.img BASE=${{ github.event.inputs.base }} PAGESIZE=${{ github.event.inputs.pagesize }} CMDLINE="${{ github.event.inputs.cmdline }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel_and_boot
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/*.dtb
            boot_custom.img
