name: Build Samsung ARM64 Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/kernel_build
      OUTPUT_DIR: ${{ github.workspace }}/kernel_build/out
      DEVICE_DEFCONFIG: your_device_defconfig_here # e.g., "exynos_defconfig"
      KERNEL_BRANCH: main # change to your kernel branch

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo bc bison flex libssl-dev make gcc-aarch64-linux-gnu \
                              binutils-aarch64-linux-gnu clang llvm libncurses-dev ccache python3 python3-distutils || true

      - name: Initialize repo
        run: |
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          if [ ! -d ".repo" ]; then
            repo init -u https://android.googlesource.com/kernel/manifest -b $KERNEL_BRANCH
          fi
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags

      - name: Build kernel
        run: |
          cd $BUILD_DIR
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 50G || true

          # fallback to clang if needed
          if ! command -v ${CROSS_COMPILE}gcc >/dev/null 2>&1; then
              echo "GCC not found, using clang"
              export CROSS_COMPILE=clang
          fi

          make mrproper || true
          make clean || true
          make $DEVICE_DEFCONFIG
          make -j$(nproc) O=$OUTPUT_DIR

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-image
          path: ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
