name: Build Samsung SM-G770F Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout kernel source
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: sh4dow6oy/samsung_kernel
          ref: SM-G770F
          submodules: recursive

      # 2️⃣ Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make git bc bison flex libssl-dev libncurses5-dev libelf-dev wget tar

      # 3️⃣ Setup Proton Clang toolchain (modern)
      - name: Setup Proton Clang toolchain
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O proton-clang.tar.xz "https://github.com/kdrag0n/proton-clang/releases/download/16.0.0/clang-r481631b.tar.xz"
          tar -xf proton-clang.tar.xz -C "$TOOLCHAIN_PATH"
          echo "PATH=$TOOLCHAIN_PATH/clang-r481631b/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LLVM toolchain ready"

      # 4️⃣ Clean output folder
      - name: Clean output folder
        run: rm -rf out

      # 5️⃣ Configure kernel using g770f_defconfig
      - name: Configure kernel
        run: make O=out ARCH=arm64 g770f_defconfig CC=$CC

      # 6️⃣ Build kernel
      - name: Build kernel
        run: make O=out ARCH=arm64 CC=$CC -j$(nproc)

      # 7️⃣ Package kernel + dtb + modules
      - name: Package kernel
        run: |
          mkdir -p package
          # Copy Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb package/
          # Copy modules
          make O=out ARCH=arm64 INSTALL_MOD_PATH=package modules_install
          # Create tar.gz
          tar -czvf kernel-sm-g770f.tar.gz -C package .
        working-directory: ./kernel

      # 8️⃣ Upload packaged kernel
      - name: Upload packaged kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm-g770f
          path: kernel/out/kernel-sm-g770f.tar.gz
