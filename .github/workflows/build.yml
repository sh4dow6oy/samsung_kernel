name: 🧩 Samsung Kernel Builder (SM-G770F)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🧰 Setup environment
        run: |
          sudo apt update
          sudo apt install -y bc bison flex git zip curl kmod cpio libncurses5-dev libssl-dev \
            gcc clang llvm lld make python3 wget

      # Download and extract Clang r416183b from AOSP mirrors
      - name: ⚙️ Setup Clang toolchain
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          echo "📦 Downloading Clang r416183b..."
          wget -qO clang.tar.xz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b669748458572622ed716407611633c5415da25c/clang-r416183b.tar.xz"
          echo "📂 Extracting..."
          tar -xf clang.tar.xz -C "$TOOLCHAIN_PATH"
          echo "PATH=$TOOLCHAIN_PATH/clang-r416183b/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "Clang toolchain setup complete ✅"

      # ARM64 GCC toolchain (cross-compiler)
      - name: 🧩 Setup ARM64 GCC
        run: |
          GCC_PATH="$PWD/toolchain/gcc"
          mkdir -p "$GCC_PATH"
          echo "📦 Downloading GCC toolchain..."
          wget -qO arm64-gcc.tar.xz "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          tar -xf arm64-gcc.tar.xz -C "$GCC_PATH"
          echo "CROSS_COMPILE=$GCC_PATH/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
          echo "ARM64 GCC ready ✅"

      # Configure kernel with existing defconfig
      - name: ⚙️ Configure kernel
        run: |
          echo "🧩 Using defconfig: g770f_defconfig"
          make O=out ARCH=arm64 g770f_defconfig CC=$CC

      # 🩹 Patch unsupported compiler flags (stack protector)
      - name: 🩹 Patch kernel config
        run: |
          echo "🩹 Disabling unsupported stack protector..."
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/g' out/.config || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

      # Compile kernel
      - name: 🏗️ Build kernel
        run: |
          echo "🚀 Building kernel..."
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=$CROSS_COMPILE \
            LD=ld.lld \
            KCFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS="-fno-stack-protector" \
            KBUILD_CFLAGS_MODULE="-fno-stack-protector" \
            -j$(nproc)

      # Upload build artifacts
      - name: 📦 Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out/arch/arm64/boot/Image*
